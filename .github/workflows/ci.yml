name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Documentation, lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Runs before the Node setup so a documentation-only change fails fast
      # without installing dependencies. Uses the standard library only, so it
      # needs no pip install on the runner.
      - name: Check document vocabulary consistency
        run: python3 scripts/check-doc-vocabulary.py

      - name: Check CBD-73 documentation package
        run: python3 scripts/audit-cbd-73.py

      - name: Check CBD-74 documentation package
        run: python3 scripts/audit-cbd-74.py

      - name: Check CBD-103 documentation package
        run: python3 scripts/audit-cbd-103.py

      - name: Check CBD-104 documentation package
        run: python3 scripts/audit-cbd-104.py

      - name: Check CBD-105 documentation package
        run: python3 scripts/audit-cbd-105.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all workspace checks
        run: npm run check
